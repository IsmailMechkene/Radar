# Pings Supabase every two days so the free project is never paused for inactivity (it pauses
# after about a week). Needs repository secrets SUPABASE_URL and SUPABASE_KEY (Settings ->
# Secrets and variables -> Actions). Can also be started by hand from the Actions tab.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */2 * *' # 06:17 UTC every other day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/supabase-keepalive.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
